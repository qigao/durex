plugins {
    id 'io.github.qigao.simpledsl.build'
}

simpledsl {
    javaLibrary()
    lombok()
}

// SimpleDSL 0.1.0 keeps schema helpers inside the published build artifact.
apply plugin: io.github.qigao.simpledsl.gradle.schema.SimpleDslJooqSchemaPlugin

sourceSets {
    main {
        java {
            exclude 'com/github/durex/music/support/DemoMusicData.java'
        }
    }
}

dependencies {
    api project(':music-json')
}

simpledslJooq {
    source = 'database/schema/mysql.sql'
    packageName = 'com.github.durex.model'
}
