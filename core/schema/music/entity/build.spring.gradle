plugins {
    id 'java-library'
    alias gLibs.plugins.jooq.modern
}

def gradleCatalog = extensions.getByType(org.gradle.api.artifacts.VersionCatalogsExtension).named('gLibs')
def lombok = gradleCatalog.findLibrary('lombok-modern').get()

sourceSets {
    main {
        java {
            exclude 'com/github/durex/music/support/DemoMusicData.java'
        }
    }
}

dependencies {
    api project(':music-json')
    api dbLibs.jooq.spring.core
    jooqGenerator project(':jooq-codegen')
    jooqGenerator dbLibs.jooq.spring.ext
    compileOnly lombok
    annotationProcessor lombok
}

jooq {
    version = dbLibs.versions.jooq.spring.get()
    configurations {
        main {
            generateSchemaSourceOnCompilation = true
            generationTool {
                generator {
                    database {
                        name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
                        properties {
                            property {
                                key = 'scripts'
                                value = 'database/schema/mysql.sql'
                            }
                            property {
                                key = 'sort'
                                value = 'semantic'
                            }
                            property {
                                key = 'unqualifiedSchema'
                                value = 'none'
                            }
                            property {
                                key = 'defaultNameCase'
                                value = 'as_is'
                            }
                        }
                    }
                    strategy {
                        name = 'com.github.durex.jooq.PrefixStrategy'
                    }
                    generate {
                        records = true
                        fluentSetters = true
                    }
                    target {
                        packageName = 'com.github.durex.model'
                        directory = "$buildDir/generated-src/jooq/main"
                    }
                }
            }
        }
    }
}
