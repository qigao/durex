plugins {
    id 'java-library'
    alias gLibs.plugins.jsonschema2pojo
}

def springCatalog = extensions.getByType(org.gradle.api.artifacts.VersionCatalogsExtension).named('sLibs')
def springBom = springCatalog.findLibrary('spring-bom4').get().get()

dependencies {
    api platform(springBom)
    api 'com.fasterxml.jackson.core:jackson-annotations'
    api 'com.fasterxml.jackson.core:jackson-databind'
    api 'jakarta.validation:jakarta.validation-api'
}

jsonSchema2Pojo {
    targetPackage = 'com.github.durex.music.model'
    source.setFrom files("$projectDir/json")
    includeJsr303Annotations = true
    useJakartaValidation = true
    includeGetters = true
    includeSetters = true
    includeToString = true
    includeHashcodeAndEquals = true
    generateBuilders = true
}
