plugins {
    id 'durex.spring-library'
    id 'org.jsonschema2pojo'
}

dependencies {
    api durex.library('jackson-annotations')
    api durex.library('jackson-databind')
    api durex.library('jakarta-validation')
}

jsonSchema2Pojo {
    targetPackage = 'com.github.durex.music.model'
    source = files("$projectDir/json")
    includeJsr303Annotations = true
    useJakartaValidation = true
    includeGetters = true
    includeSetters = true
    includeToString = true
    includeHashcodeAndEquals = true
    generateBuilders = true
}
