group = 'io.github.qigao.durex'
version = providers.gradleProperty('durexVersion').orElse('0.1.0-SNAPSHOT').get()

apply plugin: 'maven-publish'
apply plugin: 'signing'

def licenseNameProvider = providers.gradleProperty('durexLicenseName').orElse(providers.environmentVariable('DUREX_LICENSE_NAME'))
def licenseUrlProvider = providers.gradleProperty('durexLicenseUrl').orElse(providers.environmentVariable('DUREX_LICENSE_URL'))
def expectedLicenseName = 'Apache License, Version 2.0'
def expectedLicenseUrl = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
def signingKeyProvider = providers.gradleProperty('signingKey').orElse(providers.environmentVariable('DUREX_SIGNING_KEY'))
def signingPasswordProvider = providers.gradleProperty('signingPassword').orElse(providers.environmentVariable('DUREX_SIGNING_PASSWORD'))
def signingKeyIdProvider = providers.gradleProperty('signingKeyId').orElse(providers.environmentVariable('DUREX_SIGNING_KEY_ID'))

plugins.withId('java') {
    java {
        withSourcesJar()
        withJavadocJar()
    }

    def publicApiManifest = rootProject.file('gradle/public-api/0.1-surface.txt')
    def publicApiSourceIncludes = {
        if (!publicApiManifest.isFile()) {
            throw new GradleException("Missing Durex public API manifest: ${publicApiManifest}")
        }

        publicApiManifest.readLines('UTF-8')
            .collect { it.trim() }
            .findAll { it && !it.startsWith('#') }
            .collect { it.split('\\|', 3) }
            .findAll { parts -> parts.length == 3 && parts[0] == project.name && parts[1] == 'api' }
            .collect { parts -> parts[2].replace('.', '/') + '.java' }
    }

    def strictPublicApiJavadoc = tasks.register('durexPublicApiJavadoc', Javadoc) {
        group = 'verification'
        description = 'Runs warning-as-error Javadoc only for manifest-declared Durex user API types.'

        def apiSourceIncludes = publicApiSourceIncludes()
        source = sourceSets.main.allJava.matching {
            apiSourceIncludes.each { pattern -> include pattern }
        }
        classpath = sourceSets.main.compileClasspath + sourceSets.main.output
        destinationDir = layout.buildDirectory.dir('docs/durex-public-api').get().asFile
        failOnError = true

        options.memberLevel = org.gradle.external.javadoc.JavadocMemberLevel.PROTECTED
        options.encoding = 'UTF-8'
        options.charSet = 'UTF-8'
        options.docEncoding = 'UTF-8'
        options.addBooleanOption('Werror', true)
        options.addBooleanOption('Xdoclint:all', true)

        doFirst {
            if (apiSourceIncludes.isEmpty()) {
                throw new GradleException("No scope=api types declared for ${project.name}")
            }

            def expected = apiSourceIncludes as Set
            def actual = source.files.collect { file ->
                sourceSets.main.allJava.srcDirs
                    .find { srcDir -> file.toPath().startsWith(srcDir.toPath()) }
                    ?.toPath()
                    ?.relativize(file.toPath())
                    ?.toString()
                    ?.replace('\\', '/')
            }.findAll { it } as Set

            if (actual != expected) {
                throw new GradleException(
                    "Public API Javadoc source mismatch for ${project.name}. expected=${expected}, actual=${actual}")
            }
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                pom {
                    name = "Durex ${project.name}"
                    description = "Durex public runtime/API module ${project.name}"
                    url = 'https://github.com/qigao/durex'

                    def licenseName = licenseNameProvider.orNull
                    def licenseUrl = licenseUrlProvider.orNull
                    if (licenseName && licenseUrl) {
                        licenses {
                            license {
                                name = licenseName
                                url = licenseUrl
                                distribution = 'repo'
                            }
                        }
                    }

                    developers {
                        developer {
                            id = 'qigao'
                            name = 'Qi Gao'
                            url = 'https://github.com/qigao'
                        }
                    }

                    scm {
                        connection = 'scm:git:https://github.com/qigao/durex.git'
                        developerConnection = 'scm:git:ssh://git@github.com/qigao/durex.git'
                        url = 'https://github.com/qigao/durex'
                    }
                }
            }
        }
        repositories {
            maven {
                name = 'staging'
                def stagingRepository = providers.gradleProperty('durexStagingRepo').orNull
                url = uri(stagingRepository ?: layout.buildDirectory.dir('staging-repository').get().asFile)
            }
        }
    }

    tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenRepository).configureEach {
        dependsOn strictPublicApiJavadoc
    }

    def verifyCanonicalLicense = tasks.register('verifyDurexCanonicalLicense') {
        group = 'publishing'
        description = 'Verifies the repository and Maven publication use the canonical Apache-2.0 license.'
        doLast {
            def licenseFile = rootProject.file('LICENSE')
            if (!licenseFile.isFile()) {
                throw new GradleException('Durex publication requires the canonical Apache-2.0 LICENSE file at repository root.')
            }
            if (licenseNameProvider.orNull != expectedLicenseName || licenseUrlProvider.orNull != expectedLicenseUrl) {
                throw new GradleException(
                    "Durex publication license must be '${expectedLicenseName}' (${expectedLicenseUrl}); " +
                    "got name='${licenseNameProvider.orNull}', url='${licenseUrlProvider.orNull}'.")
            }
        }
    }

    def verifyReleaseMetadata = tasks.register('verifyDurexReleaseMetadata') {
        group = 'publishing'
        description = 'Rejects a non-SNAPSHOT Durex publication when mandatory release metadata is missing.'
        doLast {
            if (!version.toString().endsWith('-SNAPSHOT')) {
                if (!licenseNameProvider.isPresent() || !licenseUrlProvider.isPresent()) {
                    throw new GradleException(
                        'Durex release publication requires durexLicenseName and durexLicenseUrl. ' +
                        'Choose and commit the project distribution license before publishing a release.')
                }
            }
        }
    }

    tasks.named('generatePomFileForMavenJavaPublication') {
        dependsOn verifyCanonicalLicense
        dependsOn verifyReleaseMetadata
    }

    signing {
        def signingKey = signingKeyProvider.orNull
        def signingPassword = signingPasswordProvider.orNull
        def signingKeyId = signingKeyIdProvider.orNull

        if (signingKey) {
            if (signingKeyId) {
                useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
            } else {
                useInMemoryPgpKeys(signingKey, signingPassword)
            }
        }

        required { signingKeyProvider.isPresent() }
        sign publishing.publications.mavenJava
    }
}
