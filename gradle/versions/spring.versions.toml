# versions for libraries
[versions]
# legacy Spring Boot line retained during migration
springboot = "2.7.1"
spring-bom = "1.0.12.RELEASE"
# Spring-first platform
springboot4 = "4.1.0"
graalvm = "1.1.1"

# Libs config
[libraries]
spring-bom4 = { group = "org.springframework.boot", name = "spring-boot-dependencies", version.ref = "springboot4" }

[bundles]

# Gradle plugins config
[plugins]
spring-bom = { id = "io.spring.dependency-management", version.ref = "spring-bom" }
springboot = { id = "org.springframework.boot", version.ref = "springboot" }
springboot4 = { id = "org.springframework.boot", version.ref = "springboot4" }
graalvm = { id = "org.graalvm.buildtools.native", version.ref = "graalvm" }
