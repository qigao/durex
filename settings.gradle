pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'io.github.qigao.simpledsl.settings' version '0.2.0'
}

rootProject.name = 'durex'

simpledslSettings {
    repositoryRoot.set(layout.settingsDirectory)
    modulesManifest.set(layout.settingsDirectory.file('gradle/modules.toml'))
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}
