name: SimpleDSL Source Integration

on:
  push:
    paths:
      - 'core/**'
      - 'gradle/**'
      - 'migration/**'
      - 'reference/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/gradle/simpledsl-source.init.gradle'
      - '.github/workflows/simpledsl-source-integration.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'gradle/**'
      - 'migration/**'
      - 'reference/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/gradle/simpledsl-source.init.gradle'
      - '.github/workflows/simpledsl-source-integration.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-integration:
    runs-on: ubuntu-latest
    env:
      SIMPLEDSL_SOURCE: ${{ github.workspace }}/.simpledsl
      SIMPLEDSL_INIT_SCRIPT: ${{ github.workspace }}/.github/gradle/simpledsl-source.init.gradle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: qigao/simpledsl
          path: .simpledsl
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Compile and test SimpleDSL source
        run: gradle -p .simpledsl :simpledsl-build-bootstrap:check :simpledsl-build-logic:check --stacktrace

      - name: Verify Durex project graph through SimpleDSL source
        run: ./gradlew -I "$SIMPLEDSL_INIT_SCRIPT" projects simpledslProjects --stacktrace

      - name: Verify Durex core build through SimpleDSL source
        run: ./gradlew -I "$SIMPLEDSL_INIT_SCRIPT" :music-json:compileJava :music-entity:compileJava :music-repo:compileJava :music-api:compileJava :music-client:test :music:test --configuration-cache --stacktrace
