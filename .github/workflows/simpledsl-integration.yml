name: SimpleDSL Integration

on:
  push:
    branches:
      - master
    paths:
      - 'core/**'
      - 'gradle/**'
      - 'dependencies.toml'
      - 'dependencies/**'
      - 'migration/**'
      - 'reference/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/simpledsl-integration.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'gradle/**'
      - 'dependencies.toml'
      - 'dependencies/**'
      - 'migration/**'
      - 'reference/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/simpledsl-integration.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portal-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Verify root Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version | tee /tmp/durex-wrapper-version.log
          grep -Fq 'Gradle 9.1.0' /tmp/durex-wrapper-version.log

      - name: Reject SimpleDSL implementation-class leakage
        shell: bash
        run: |
          set -euo pipefail
          hits="$({
            find core migration reference -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'build.spring.gradle' -o -name 'build.spring.gradle.kts' \) \
              -exec grep -Hn -E 'io\.github\.qigao\.simpledsl\.gradle\.' {} + || true
          })"
          if [ -n "$hits" ]; then
            echo "$hits"
            echo 'Durex build descriptors must use the public SimpleDSL DSL, not implementation classes.'
            exit 1
          fi

      - name: Require SimpleDSL 0.3 plugin contracts
        shell: bash
        run: |
          set -euo pipefail
          settings=(
            settings.gradle
            migration/spring-music/settings.gradle
            migration/spring-messaging/settings.gradle
            reference/spring-native/settings.gradle.kts
            reference/spring-capabilities/settings.gradle.kts
          )
          for file in "${settings[@]}"; do
            if ! grep -Fq '0.3.0' "$file"; then
              echo "SimpleDSL 0.3.0 is not pinned in $file"
              exit 1
            fi
            if grep -Eq '0\.[12]\.' "$file"; then
              echo "legacy SimpleDSL version remains in $file"
              exit 1
            fi
          done

          old_plugins="$({
            find core migration reference -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'build.spring.gradle' -o -name 'build.spring.gradle.kts' \) \
              -exec grep -Hn -F 'io.github.qigao.simpledsl.build' {} + || true
          })"
          if [ -n "$old_plugins" ]; then
            echo "$old_plugins"
            echo 'legacy SimpleDSL project plugin remains'
            exit 1
          fi

          old_manifest="$({ grep -Hn -E '^\[java\]|^\[platforms\.' dependencies.toml dependencies/*.toml 2>/dev/null || true; })"
          if [ -n "$old_manifest" ]; then
            echo "$old_manifest"
            echo 'legacy SimpleDSL dependency-manifest schema remains'
            exit 1
          fi

      - name: Require SimpleDSL 0.3 root manifest convention
        shell: bash
        run: |
          set -euo pipefail
          test -f dependencies.toml
          for fragment in spring database test utils; do
            test -f "dependencies/${fragment}.toml"
          done
          test ! -e gradle/dependencies
          grep -Fq '[simpledsl]' dependencies.toml
          grep -Fq 'java = 25' dependencies.toml
          grep -Fq '[libraries.spring]' dependencies/spring.toml
          settings=(
            settings.gradle
            migration/spring-music/settings.gradle
            migration/spring-messaging/settings.gradle
            reference/spring-native/settings.gradle.kts
            reference/spring-capabilities/settings.gradle.kts
          )
          for file in "${settings[@]}"; do
            if grep -Fq 'dependencyManifest.set' "$file"; then
              echo "explicit dependency manifest override remains in $file"
              exit 1
            fi
          done

      - name: Verify SimpleDSL 0.3.0 project graph from Plugin Portal
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew projects simpledslProjects --stacktrace | tee /tmp/durex-root-projects.log
          for module in music music-api music-client music-json music-entity music-repo shared-common shared-spring-http shared-utils messaging-api messaging-spring-redis; do
            grep -Fq ":${module} |" /tmp/durex-root-projects.log
          done
          ! grep -Fq ':json-schema-annotation |' /tmp/durex-root-projects.log
          ! grep -Fq ':core:' /tmp/durex-root-projects.log

      - name: Verify Durex core build through Plugin Portal
        run: ./gradlew :shared-common:test :shared-spring-http:test :music-json:compileJava :music-entity:compileJava :music-repo:compileJava :music-api:compileJava :music-client:test :music:test --configuration-cache --stacktrace

      - name: Verify music layering and runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq "project(':music')" core/api/music/build.spring.gradle; then
            echo 'music-api must not depend on the music server implementation'
            exit 1
          fi
          bash migration/spring-music/verify-runtime-boundary.sh
          ./gradlew :music:dependencies --configuration compileClasspath --stacktrace | tee /tmp/music-compile-classpath.log
          if grep -E 'javax\.enterprise|javax\.inject:|javax\.transaction|javax\.interceptor|io\.quarkus' /tmp/music-compile-classpath.log; then
            echo 'obsolete runtime dependency leaked into music compileClasspath'
            exit 1
          fi
          hits="$({
            find core/api core/music core/schema/music core/shared -name 'build.spring.gradle' -exec grep -Hn -E 'VersionCatalogsExtension|[a-z]Libs\.' {} + || true
          })"
          test -z "$hits" || { echo "$hits"; exit 1; }
