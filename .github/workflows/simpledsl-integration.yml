name: SimpleDSL Integration

on:
  push:
    paths:
      - 'core/**'
      - 'gradle/**'
      - 'dependencies.toml'
      - 'dependencies/**'
      - 'migration/**'
      - 'reference/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/simpledsl-integration.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'gradle/**'
      - 'dependencies.toml'
      - 'dependencies/**'
      - 'migration/**'
      - 'reference/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/simpledsl-integration.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portal-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Reject SimpleDSL implementation-class leakage
        shell: bash
        run: |
          set -euo pipefail
          hits="$({
            find core migration reference -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'build.spring.gradle' -o -name 'build.spring.gradle.kts' \) \
              -exec grep -Hn -E 'io\.github\.qigao\.simpledsl\.gradle\.' {} + || true
          })"
          if [ -n "$hits" ]; then
            echo "$hits"
            echo 'Durex build descriptors must use the public SimpleDSL DSL, not implementation classes.'
            exit 1
          fi

      - name: Require SimpleDSL 0.3 plugin contracts
        shell: bash
        run: |
          set -euo pipefail
          settings=(
            settings.gradle
            migration/spring-music/settings.gradle
            migration/spring-messaging/settings.gradle
            reference/spring-native/settings.gradle.kts
            reference/spring-capabilities/settings.gradle.kts
          )
          for file in "${settings[@]}"; do
            if ! grep -Fq '0.3.0' "$file"; then
              echo "SimpleDSL 0.3.0 is not pinned in $file"
              exit 1
            fi
            if grep -Eq '0\.[12]\.' "$file"; then
              echo "legacy SimpleDSL version remains in $file"
              exit 1
            fi
          done

          old_plugins="$({
            find core migration reference -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'build.spring.gradle' -o -name 'build.spring.gradle.kts' \) \
              -exec grep -Hn -F 'io.github.qigao.simpledsl.build' {} + || true
          })"
          if [ -n "$old_plugins" ]; then
            echo "$old_plugins"
            echo 'legacy SimpleDSL project plugin remains'
            exit 1
          fi

          old_manifest="$({ grep -Hn -E '^\[java\]|^\[platforms\.' dependencies.toml dependencies/*.toml 2>/dev/null || true; })"
          if [ -n "$old_manifest" ]; then
            echo "$old_manifest"
            echo 'legacy SimpleDSL dependency-manifest schema remains'
            exit 1
          fi

      - name: Require SimpleDSL 0.3 root manifest convention
        shell: bash
        run: |
          set -euo pipefail
          test -f dependencies.toml
          for fragment in spring database test utils; do
            test -f "dependencies/${fragment}.toml"
          done
          test ! -e gradle/dependencies
          grep -Fq '[simpledsl]' dependencies.toml
          grep -Fq 'java = 25' dependencies.toml
          grep -Fq '[libraries.spring]' dependencies/spring.toml
          settings=(
            settings.gradle
            migration/spring-music/settings.gradle
            migration/spring-messaging/settings.gradle
            reference/spring-native/settings.gradle.kts
            reference/spring-capabilities/settings.gradle.kts
          )
          for file in "${settings[@]}"; do
            if grep -Fq 'dependencyManifest.set' "$file"; then
              echo "explicit dependency manifest override remains in $file"
              exit 1
            fi
          done

      - name: Verify SimpleDSL 0.3.0 project graph from Plugin Portal
        run: ./gradlew projects simpledslProjects --stacktrace

      - name: Verify Durex core build through Plugin Portal
        run: ./gradlew :shared-common:test :shared-spring-http:test :music-json:compileJava :music-entity:compileJava :music-repo:compileJava :music-api:compileJava :music-client:test :music:test --configuration-cache --stacktrace
