name: Durex Build Platform

on:
  push:
    branches:
      - design/durex-build-platform
    paths:
      - 'build-bootstrap/**'
      - 'build-logic/**'
      - 'gradle/dependencies/**'
      - '.github/workflows/durex-build-platform.yml'
  pull_request:
    paths:
      - 'build-bootstrap/**'
      - 'build-logic/**'
      - 'gradle/dependencies/**'
      - '.github/workflows/durex-build-platform.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Valid manifest and diagnostics
        run: gradle -p build-bootstrap/tests/manifest-valid verifyDurexManifest durexDependencies --stacktrace
      - name: Managed external plugin resolution
        run: gradle -p build-bootstrap/tests/plugin-resolution verifyPluginResolution --stacktrace
      - name: Manifest validation failures are Durex errors
        shell: bash
        run: |
          set -euo pipefail
          cases=(cycle-a.toml duplicate-root.toml unknown-ref.toml version-conflict.toml unsupported.toml)
          for manifest in "${cases[@]}"; do
            log="build-bootstrap/tests/manifest-validation/${manifest}.log"
            if gradle -p build-bootstrap/tests/manifest-validation help -Pmanifest="$manifest" --stacktrace >"$log" 2>&1; then
              echo "expected $manifest to fail"
              exit 1
            fi
            grep -q 'Durex dependency manifest error' "$log"
          done
      - name: Automatic module discovery
        run: gradle -p build-bootstrap/tests/modules-auto projects durexProjects --stacktrace
      - name: Manual module discovery
        run: gradle -p build-bootstrap/tests/modules-manual projects durexProjects --stacktrace
      - name: Strict and conflict discovery failures
        shell: bash
        run: |
          set -euo pipefail
          for fixture in modules-strict modules-conflict; do
            log="build-bootstrap/tests/${fixture}.log"
            if gradle -p "build-bootstrap/tests/${fixture}" projects --stacktrace >"$log" 2>&1; then
              echo "expected ${fixture} to fail"
              exit 1
            fi
            grep -q 'Durex module discovery error' "$log"
          done
      - name: Build logic bootstrap
        run: gradle -p build-logic tasks --stacktrace
      - name: jOOQ schema convention smoke
        shell: bash
        run: |
          gradle -p build-logic/tests/jooq-schema-smoke jooqCodegen --stacktrace
          test -f build-logic/tests/jooq-schema-smoke/build/generated-src/jooq/main/com/example/schema/tables/QMusic.java
          test -f build-logic/tests/jooq-schema-smoke/build/generated-src/jooq/main/com/example/schema/tables/records/RMusic.java
      - name: Java module type
        run: gradle -p build-logic/tests/java-library-smoke test --stacktrace
      - name: Spring service module type
        run: gradle -p build-logic/tests/spring-service-smoke verifyDurexService dependencies --configuration compileClasspath --stacktrace
      - name: Module type conflict is rejected
        shell: bash
        run: |
          log=build-logic/tests/module-conflict.log
          if gradle -p build-logic/tests/module-conflict help --stacktrace >"$log" 2>&1; then
            echo 'expected module type conflict to fail'
            exit 1
          fi
          grep -q 'Durex module type conflict' "$log"
