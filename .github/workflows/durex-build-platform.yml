name: Durex Build Platform

on:
  push:
    paths:
      - 'build-bootstrap/**'
      - 'build-logic/**'
      - 'gradle/dependencies/**'
      - 'core/**/build.spring.gradle'
      - 'migration/spring-music/**'
      - '.github/workflows/durex-build-platform.yml'
  pull_request:
    paths:
      - 'build-bootstrap/**'
      - 'build-logic/**'
      - 'gradle/dependencies/**'
      - 'core/**/build.spring.gradle'
      - 'migration/spring-music/**'
      - '.github/workflows/durex-build-platform.yml'

permissions:
  contents: read

jobs:
  platform-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Valid manifest and generic diagnostics
        run: gradle -p build-bootstrap/tests/manifest-valid verifyDurexManifest durexDependencies --stacktrace

      - name: Managed external plugin resolution
        run: gradle -p build-bootstrap/tests/plugin-resolution verifyPluginResolution --stacktrace

      - name: Manifest validation failures are specific Durex errors
        shell: bash
        run: |
          set -euo pipefail
          check_failure() {
            local manifest="$1"
            local expected="$2"
            local log="build-bootstrap/tests/manifest-validation/${manifest}.log"
            if gradle -p build-bootstrap/tests/manifest-validation help -Pmanifest="$manifest" --stacktrace >"$log" 2>&1; then
              echo "expected $manifest to fail"
              exit 1
            fi
            grep -Fq 'Durex dependency manifest error' "$log"
            grep -Fq "$expected" "$log"
          }
          check_failure cycle-a.toml 'include cycle detected'
          check_failure duplicate-root.toml "duplicate version id 'x'"
          check_failure unknown-ref.toml "unknown version.ref 'missing'"
          check_failure version-conflict.toml 'platform and explicit version ownership are mutually exclusive'
          check_failure unsupported.toml 'unsupported key(s): unsupported'

      - name: Automatic module discovery
        shell: bash
        run: |
          gradle -p build-bootstrap/tests/modules-auto projects durexProjects --stacktrace | tee build-bootstrap/tests/modules-auto.log
          grep -Fq ':music | core/music | auto | build.gradle' build-bootstrap/tests/modules-auto.log
          grep -Fq ':shared-utils | core/shared/utils | auto | build.gradle' build-bootstrap/tests/modules-auto.log
          grep -Fq ':shared-common | core/shared/jakarta/common | manual | build.gradle' build-bootstrap/tests/modules-auto.log
          grep -Fq ':music-repo | core/schema/music/repo | auto | build.gradle' build-bootstrap/tests/modules-auto.log
          if grep -Fq ':ignored' build-bootstrap/tests/modules-auto.log; then exit 1; fi

      - name: Manual module discovery and alternate build file
        shell: bash
        run: |
          gradle -p build-bootstrap/tests/modules-manual projects durexProjects --stacktrace | tee build-bootstrap/tests/modules-manual.log
          grep -Fq ':music | core/music | manual | build.spring.gradle' build-bootstrap/tests/modules-manual.log
          grep -Fq ':admin-tool | tools/admin | manual | build.gradle' build-bootstrap/tests/modules-manual.log

      - name: Strict and conflict discovery failures
        shell: bash
        run: |
          set -euo pipefail
          log=build-bootstrap/tests/modules-strict.log
          if gradle -p build-bootstrap/tests/modules-strict projects --stacktrace >"$log" 2>&1; then exit 1; fi
          grep -Fq 'Durex module discovery error' "$log"
          grep -Fq 'strict-auto cannot infer a canonical project name' "$log"

          log=build-bootstrap/tests/modules-conflict.log
          if gradle -p build-bootstrap/tests/modules-conflict projects --stacktrace >"$log" 2>&1; then exit 1; fi
          grep -Fq 'Durex module discovery error' "$log"
          grep -Fq "duplicate logical project ':same'" "$log"

      - name: Build logic bootstrap
        run: gradle -p build-logic tasks --stacktrace

      - name: Neutral dependency snapshot bridge
        run: gradle -p build-logic/tests/registry-bridge-smoke help --stacktrace

      - name: Snapshot schema mismatch is rejected
        shell: bash
        run: |
          log=build-logic/tests/registry-schema-mismatch.log
          if gradle -p build-logic/tests/registry-schema-mismatch help --stacktrace >"$log" 2>&1; then exit 1; fi
          grep -Fq 'Durex bootstrap error' "$log"
          grep -Fq 'unsupported dependency snapshot schema' "$log"
          grep -Fq 'Expected: 1' "$log"
          grep -Fq 'Actual: 99' "$log"

      - name: jOOQ schema convention smoke
        shell: bash
        run: |
          gradle -p build-logic/tests/jooq-schema-smoke jooqCodegen --stacktrace
          test -f build-logic/tests/jooq-schema-smoke/build/generated-src/jooq/main/com/example/schema/tables/QMusic.java
          test -f build-logic/tests/jooq-schema-smoke/build/generated-src/jooq/main/com/example/schema/tables/records/RMusic.java

      - name: Managed module model
        run: gradle -p build-logic/tests/module-model-smoke verifyModuleModel --stacktrace

      - name: Java module type
        run: gradle -p build-logic/tests/java-library-smoke test --stacktrace

      - name: Spring service module type
        run: gradle -p build-logic/tests/spring-service-smoke verifyDurexService dependencies --configuration compileClasspath --stacktrace

      - name: Module type conflict is rejected
        shell: bash
        run: |
          log=build-logic/tests/module-conflict.log
          if gradle -p build-logic/tests/module-conflict help --stacktrace >"$log" 2>&1; then exit 1; fi
          grep -Fq 'Durex configuration error' "$log"
          grep -Fq 'Problem: module type conflict' "$log"
          grep -Fq 'Existing: SPRING_SERVICE' "$log"
          grep -Fq 'Requested: JAVA_LIBRARY' "$log"

      - name: Configuration-aware dependency API
        run: gradle -p build-logic/tests/dependency-api-smoke verifyDependencyBindings dependencies --configuration api --stacktrace

      - name: Platform-managed library escape hatch is rejected
        shell: bash
        run: |
          log=build-logic/tests/dependency-library-invalid.log
          if gradle -p build-logic/tests/dependency-library-invalid help --stacktrace >"$log" 2>&1; then exit 1; fi
          grep -Fq 'Durex configuration error' "$log"
          grep -Fq 'platform-managed library cannot be returned by durex.library(alias)' "$log"
          grep -Fq 'durex.dependency(configuration, alias)' "$log"

      - name: Capability kernel positive path
        run: gradle -p build-logic/tests/capability-kernel-smoke verifyCapabilityKernel --stacktrace

      - name: Capability kernel negative paths
        shell: bash
        run: |
          set -euo pipefail
          check_failure() {
            local fixture="$1"
            local expected="$2"
            local log="build-logic/tests/${fixture}.log"
            if gradle -p "build-logic/tests/$fixture" help --stacktrace >"$log" 2>&1; then
              echo "expected $fixture to fail"
              exit 1
            fi
            grep -Fq 'Durex configuration error' "$log"
            grep -Fq "$expected" "$log"
          }
          check_failure capability-missing-required "required capability 'bar' is not registered"
          check_failure capability-cycle 'capability requirement cycle detected'
          check_failure capability-conflict "conflicts with enabled capability 'bar'"
          check_failure capability-module-invalid "is not supported by JAVA_LIBRARY"

      - name: Feature coexistence through capability engine
        shell: bash
        run: |
          gradle -p build-logic/tests/features-smoke durexCapabilities dependencies --configuration compileClasspath --stacktrace | tee build-logic/tests/features-smoke.log
          grep -Fq 'Type: SPRING_SERVICE' build-logic/tests/features-smoke.log
          grep -Fq 'Platforms: spring' build-logic/tests/features-smoke.log
          grep -Fq 'Features: jooq,jpa,redis' build-logic/tests/features-smoke.log
          grep -Fq 'Native: disabled' build-logic/tests/features-smoke.log

      - name: Invalid native capability is rejected
        shell: bash
        run: |
          log=build-logic/tests/feature-invalid.log
          if gradle -p build-logic/tests/feature-invalid help --stacktrace >"$log" 2>&1; then exit 1; fi
          grep -Fq 'Durex configuration error' "$log"
          grep -Fq "capability 'native' is not supported by JAVA_LIBRARY" "$log"

      - name: Generic capability plugin path
        run: gradle -p build-logic/tests/generic-capability-smoke verifyGenericCapability --stacktrace

      - name: Direct capability plugin path
        run: gradle -p build-logic/tests/generic-capability-direct verifyDirectCapability --stacktrace

      - name: Generic capability missing mapping is rejected
        shell: bash
        run: |
          log=build-logic/tests/generic-capability-missing-mapping.log
          if gradle -p build-logic/tests/generic-capability-missing-mapping help --stacktrace >"$log" 2>&1; then exit 1; fi
          grep -Fq 'Durex configuration error' "$log"
          grep -Fq 'did not register a Durex primary capability' "$log"

      - name: Doctor positive path
        run: gradle -p build-logic/tests/doctor-smoke durexCapabilities durexDoctor --stacktrace

      - name: Doctor detects inconsistent plugin mapping
        shell: bash
        run: |
          log=build-logic/tests/doctor-invalid.log
          if gradle -p build-logic/tests/doctor-invalid durexDoctor --stacktrace >"$log" 2>&1; then exit 1; fi
          grep -Fq 'Durex Doctor' "$log"
          grep -Fq 'missing-capability' "$log"

      - name: Groovy DSL configuration cache reuse
        shell: bash
        run: |
          gradle -p build-logic/tests/config-cache-groovy durexDoctor --configuration-cache --stacktrace | tee /tmp/durex-cc-groovy-1.log
          gradle -p build-logic/tests/config-cache-groovy durexDoctor --configuration-cache --stacktrace | tee /tmp/durex-cc-groovy-2.log
          grep -Fq 'Reusing configuration cache.' /tmp/durex-cc-groovy-2.log

      - name: Kotlin DSL configuration cache reuse
        shell: bash
        run: |
          gradle -p build-logic/tests/config-cache-kotlin durexDoctor --configuration-cache --stacktrace | tee /tmp/durex-cc-kotlin-1.log
          gradle -p build-logic/tests/config-cache-kotlin durexDoctor --configuration-cache --stacktrace | tee /tmp/durex-cc-kotlin-2.log
          grep -Fq 'Reusing configuration cache.' /tmp/durex-cc-kotlin-2.log

      - name: Settings diagnostics configuration cache reuse
        shell: bash
        run: |
          gradle -p build-bootstrap/tests/modules-auto durexProjects --configuration-cache --stacktrace | tee /tmp/durex-cc-settings-1.log
          gradle -p build-bootstrap/tests/modules-auto durexProjects --configuration-cache --stacktrace | tee /tmp/durex-cc-settings-2.log
          grep -Fq 'Reusing configuration cache.' /tmp/durex-cc-settings-2.log

      - name: Parallel multiproject build
        run: gradle -p build-logic/tests/parallel-multiproject build --parallel --stacktrace

      - name: Music support modules on Durex Plugin Core v2
        run: gradle -p migration/spring-music :music-json:compileJava :music-entity:compileJava :music-repo:compileJava --stacktrace
