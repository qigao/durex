name: Durex Build Platform

on:
  push:
    branches:
      - design/durex-build-platform
    paths:
      - 'build-bootstrap/**'
      - 'build-logic/**'
      - 'gradle/dependencies/**'
      - '.github/workflows/durex-build-platform.yml'
  pull_request:
    paths:
      - 'build-bootstrap/**'
      - 'build-logic/**'
      - 'gradle/dependencies/**'
      - '.github/workflows/durex-build-platform.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Durex manifest bootstrap
        run: gradle -p build-bootstrap/tests/manifest-valid verifyDurexManifest --stacktrace
