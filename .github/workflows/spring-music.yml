name: Spring Music Migration

on:
  push:
    paths:
      - 'migration/spring-music/**'
      - 'core/**/build.spring.gradle'
      - 'gradle/versions/gradle.versions.toml'
      - 'gradle/versions/database.versions.toml'
      - 'gradle/library/spring-*.gradle'
      - '.github/workflows/spring-music.yml'
  pull_request:
    paths:
      - 'migration/spring-music/**'
      - 'core/**/build.spring.gradle'
      - 'gradle/versions/gradle.versions.toml'
      - 'gradle/versions/database.versions.toml'
      - 'gradle/library/spring-*.gradle'
      - '.github/workflows/spring-music.yml'

permissions:
  contents: read

jobs:
  compile-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Resolve migration project graph
        run: gradle -p migration/spring-music projects --stacktrace
      - name: Compile Spring music module graph
        run: gradle -p migration/spring-music :music:compileJava --stacktrace
