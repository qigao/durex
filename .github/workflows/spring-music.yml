name: Spring Music Migration

on:
  push:
    paths:
      - 'gradle/dependencies/**'
      - 'migration/spring-music/**'
      - 'core/api/**'
      - 'core/music/**'
      - 'core/schema/music/**'
      - 'core/shared/**/build.spring.gradle'
      - 'core/shared/utils/src/main/java/com/github/durex/sqlbuilder/**'
      - '.github/workflows/spring-music.yml'
  pull_request:
    paths:
      - 'gradle/dependencies/**'
      - 'migration/spring-music/**'
      - 'core/api/**'
      - 'core/music/**'
      - 'core/schema/music/**'
      - 'core/shared/**/build.spring.gradle'
      - 'core/shared/utils/src/main/java/com/github/durex/sqlbuilder/**'
      - '.github/workflows/spring-music.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: qigao/simpledsl
          path: .simpledsl
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Resolve SimpleDSL migration project graph
        run: gradle --include-build "$GITHUB_WORKSPACE/.simpledsl" -p migration/spring-music projects simpledslProjects --stacktrace

      - name: Validate HTTP contract and client modules
        run: gradle --include-build "$GITHUB_WORKSPACE/.simpledsl" -p migration/spring-music :music-api:compileJava :music-client:test --configuration-cache --stacktrace

      - name: Validate compile and test Spring music graph
        run: gradle --include-build "$GITHUB_WORKSPACE/.simpledsl" -p migration/spring-music :music:simpledslDoctor :music:compileJava :music:test --configuration-cache --stacktrace

      - name: Verify HTTP module layering
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq "project(':music')" core/api/music/build.spring.gradle; then
            echo 'music-api must not depend on the music server implementation'
            exit 1
          fi

      - name: Verify Spring runtime boundary
        shell: bash
        run: |
          bash migration/spring-music/verify-runtime-boundary.sh
          gradle --include-build "$GITHUB_WORKSPACE/.simpledsl" -p migration/spring-music :music:dependencies --configuration compileClasspath --stacktrace | tee /tmp/music-compile-classpath.log
          if grep -E 'javax\.enterprise|javax\.inject:|javax\.transaction|javax\.interceptor|io\.quarkus' /tmp/music-compile-classpath.log; then
            echo 'legacy runtime dependency leaked into Spring compileClasspath'
            exit 1
          fi

      - name: Migrated descriptors are catalog-free
        shell: bash
        run: |
          set -euo pipefail
          hits="$({
            grep -R -n -E 'VersionCatalogsExtension|[a-z]Libs\.' migration/spring-music || true
            find core/api core/music core/schema/music core/shared -name 'build.spring.gradle' -exec grep -Hn -E 'VersionCatalogsExtension|[a-z]Libs\.' {} + || true
          } )"
          if [ -n "$hits" ]; then
            echo "$hits"
            exit 1
          fi
