name: Durex Module Discovery

on:
  push:
    paths:
      - 'core/**/build.gradle'
      - 'core/**/build.spring.gradle'
      - 'gradle/modules.toml'
      - 'gradle/dependencies/**'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/gradle/simpledsl-source.init.gradle'
      - '.github/workflows/durex-module-discovery.yml'
  pull_request:
    paths:
      - 'core/**/build.gradle'
      - 'core/**/build.spring.gradle'
      - 'gradle/modules.toml'
      - 'gradle/dependencies/**'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/gradle/simpledsl-source.init.gradle'
      - '.github/workflows/durex-module-discovery.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discovery-contract:
    runs-on: ubuntu-latest
    env:
      SIMPLEDSL_SOURCE: ${{ github.workspace }}/.simpledsl
      SIMPLEDSL_INIT_SCRIPT: ${{ github.workspace }}/.github/gradle/simpledsl-source.init.gradle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: qigao/simpledsl
          path: .simpledsl
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Verify root Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version | tee /tmp/durex-wrapper-version.log
          grep -Fq 'Gradle 9.1.0' /tmp/durex-wrapper-version.log

      - name: Verify root SimpleDSL project graph from source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -I "$SIMPLEDSL_INIT_SCRIPT" projects simpledslProjects --stacktrace | tee /tmp/durex-root-projects.log
          for module in music music-api music-client music-json music-entity music-repo shared-common shared-spring-interceptor shared-utils json-schema-annotation messaging-api messaging-spring-redis; do
            grep -Fq ":${module} |" /tmp/durex-root-projects.log
          done
          if grep -Fq ':core:' /tmp/durex-root-projects.log; then
            echo 'legacy hierarchical Gradle project path leaked into root SimpleDSL graph'
            exit 1
          fi
