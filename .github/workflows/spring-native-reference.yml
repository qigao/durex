name: Spring Native Reference

on:
  push:
    paths:
      - 'reference/spring-native/**'
      - 'reference/spring-capabilities/**'
      - 'gradle/dependencies/**'
      - '.github/gradle/simpledsl-source.init.gradle'
      - '.github/workflows/spring-native-reference.yml'
  pull_request:
    paths:
      - 'reference/spring-native/**'
      - 'reference/spring-capabilities/**'
      - 'gradle/dependencies/**'
      - '.github/gradle/simpledsl-source.init.gradle'
      - '.github/workflows/spring-native-reference.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm-test:
    runs-on: ubuntu-latest
    env:
      SIMPLEDSL_SOURCE: ${{ github.workspace }}/.simpledsl
      SIMPLEDSL_INIT_SCRIPT: ${{ github.workspace }}/.github/gradle/simpledsl-source.init.gradle
    defaults:
      run:
        working-directory: reference/spring-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: qigao/simpledsl
          path: .simpledsl
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Resolve Spring platform capabilities
        run: gradle -I "$SIMPLEDSL_INIT_SCRIPT" -p ../spring-capabilities simpledslDoctor dependencies --configuration compileClasspath --configuration-cache --stacktrace
      - name: JVM tests and SimpleDSL doctor
        run: gradle -I "$SIMPLEDSL_INIT_SCRIPT" simpledslDoctor test --configuration-cache --stacktrace
      - name: Spring AOT JVM smoke test
        shell: bash
        run: |
          gradle -I "$SIMPLEDSL_INIT_SCRIPT" processAot bootJar --configuration-cache --stacktrace
          java -Dspring.aot.enabled=true -jar build/libs/spring-native-reference-0.1.0-SNAPSHOT.jar > build/aot-app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if response=$(curl --fail --silent http://127.0.0.1:8080/hello); then
              test "$response" = 'Hello from Spring Native'
              exit 0
            fi
            sleep 1
          done
          cat build/aot-app.log
          exit 1

  native-test:
    runs-on: ubuntu-latest
    env:
      SIMPLEDSL_SOURCE: ${{ github.workspace }}/.simpledsl
      SIMPLEDSL_INIT_SCRIPT: ${{ github.workspace }}/.github/gradle/simpledsl-source.init.gradle
    defaults:
      run:
        working-directory: reference/spring-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: qigao/simpledsl
          path: .simpledsl
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: SimpleDSL doctor on native project
        run: gradle -I "$SIMPLEDSL_INIT_SCRIPT" simpledslDoctor --stacktrace
      - name: Native tests
        run: gradle -I "$SIMPLEDSL_INIT_SCRIPT" nativeTest --stacktrace
      - name: Native executable
        run: gradle -I "$SIMPLEDSL_INIT_SCRIPT" nativeCompile --stacktrace
      - name: Native HTTP smoke test
        shell: bash
        run: |
          ./build/native/nativeCompile/spring-native-reference > build/native-app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if response=$(curl --fail --silent http://127.0.0.1:8080/hello); then
              test "$response" = 'Hello from Spring Native'
              exit 0
            fi
            sleep 1
          done
          cat build/native-app.log
          exit 1
