name: Spring Native Reference

on:
  push:
    paths:
      - 'reference/spring-native/**'
      - 'reference/spring-capabilities/**'
      - 'core/shared/messaging/**'
      - 'gradle/dependencies/**'
      - '.github/workflows/spring-native-reference.yml'
  pull_request:
    paths:
      - 'reference/spring-native/**'
      - 'reference/spring-capabilities/**'
      - 'core/shared/messaging/**'
      - 'gradle/dependencies/**'
      - '.github/workflows/spring-native-reference.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: reference/spring-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Resolve Spring platform capabilities from Plugin Portal
        run: gradle -p ../spring-capabilities simpledslDoctor dependencies --configuration compileClasspath --configuration-cache --stacktrace
      - name: JVM tests and SimpleDSL doctor
        run: gradle simpledslDoctor test --configuration-cache --stacktrace
      - name: Spring AOT JVM smoke test
        shell: bash
        run: |
          gradle processAot bootJar --configuration-cache --stacktrace
          java -Dspring.aot.enabled=true -jar build/libs/spring-native-reference-0.1.0-SNAPSHOT.jar > build/aot-app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if response=$(curl --fail --silent http://127.0.0.1:8080/hello); then
              test "$response" = 'Hello from Spring Native'
              exit 0
            fi
            sleep 1
          done
          cat build/aot-app.log
          exit 1

  native-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: reference/spring-native
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: SimpleDSL doctor on native project
        run: gradle simpledslDoctor --stacktrace
      - name: Native tests
        run: gradle nativeTest --stacktrace
      - name: Native executable
        run: gradle nativeCompile --stacktrace
      - name: Native HTTP and messaging smoke test
        shell: bash
        run: |
          ./build/native/nativeCompile/spring-native-reference > build/native-app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if response=$(curl --fail --silent http://127.0.0.1:8080/hello); then
              test "$response" = 'Hello from Spring Native'
              break
            fi
            sleep 1
          done
          test "$(curl --fail --silent --request POST http://127.0.0.1:8080/messaging/pubsub/native-pubsub)" = 'native-pubsub'
          test "$(curl --fail --silent --request POST http://127.0.0.1:8080/messaging/stream/native-stream)" = 'native-stream'
