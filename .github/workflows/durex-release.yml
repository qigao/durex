name: Durex Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: durex-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_SIGNING_KEY: ${{ secrets.DUREX_SIGNING_KEY }}
      RELEASE_SIGNING_PASSWORD: ${{ secrets.DUREX_SIGNING_PASSWORD }}
      RELEASE_SIGNING_KEY_ID: ${{ secrets.DUREX_SIGNING_KEY_ID }}
      CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
      CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.1.0'
      - name: Resolve exact release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_TYPE" = tag
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          version="${BASH_REMATCH[1]}"
          [[ "$version" != *SNAPSHOT* ]]
          test -f LICENSE

          tag_sha=$(git rev-list -n 1 "$tag")
          test "$tag_sha" = "$GITHUB_SHA"
          test -n "$RELEASE_SIGNING_KEY"
          test -n "$CENTRAL_TOKEN_USERNAME"
          test -n "$CENTRAL_TOKEN_PASSWORD"
          test -z "$(git status --porcelain)"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Publish signed exact release artifacts to an isolated Maven repository
        id: staging
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/durex-release-staging"
          rm -rf "$staging"

          export DUREX_SIGNING_KEY="$RELEASE_SIGNING_KEY"
          export DUREX_SIGNING_PASSWORD="$RELEASE_SIGNING_PASSWORD"
          if [[ -n "$RELEASE_SIGNING_KEY_ID" ]]; then
            export DUREX_SIGNING_KEY_ID="$RELEASE_SIGNING_KEY_ID"
          fi

          ./gradlew \
            :shared-common:publishMavenJavaPublicationToStagingRepository \
            :shared-spring-http:publishMavenJavaPublicationToStagingRepository \
            :messaging-api:publishMavenJavaPublicationToStagingRepository \
            :messaging-spring-redis:publishMavenJavaPublicationToStagingRepository \
            -PdurexStagingRepo="$staging" \
            -PdurexVersion="$VERSION" \
            --stacktrace

          echo "repository=$staging" >> "$GITHUB_OUTPUT"
      - name: Verify exact release API and Maven consumer
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          STAGING: ${{ steps.staging.outputs.repository }}
        run: |
          set -euo pipefail
          root="$STAGING/io/github/qigao/durex"
          manifest="$GITHUB_WORKSPACE/gradle/public-api/0.1-surface.txt"
          baseline="$GITHUB_WORKSPACE/gradle/public-api/0.1-signatures.txt"
          current="$RUNNER_TEMP/durex-release-signatures.txt"

          printf '%s\n' messaging-api messaging-spring-redis shared-common shared-spring-http | sort > "$RUNNER_TEMP/expected-artifacts.txt"
          find "$root" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort > "$RUNNER_TEMP/actual-artifacts.txt"
          diff -u "$RUNNER_TEMP/expected-artifacts.txt" "$RUNNER_TEMP/actual-artifacts.txt"

          scripts/public-api-signatures.sh generate "$root" "$manifest" "$current" "$VERSION"
          diff -u <(LC_ALL=C sort -u "$baseline") "$current"
          scripts/public-api-signatures.sh check "$root" "$manifest" "$baseline" "$VERSION"

          for artifact in shared-common shared-spring-http messaging-api messaging-spring-redis; do
            pom="$root/$artifact/$VERSION/$artifact-$VERSION.pom"
            test -f "$pom"
            grep -Fq '<id>qigao</id>' "$pom"
            grep -Fq '<connection>scm:git:https://github.com/qigao/durex.git</connection>' "$pom"
            grep -Fq '<licenses>' "$pom"
            grep -Fq '<name>Apache License, Version 2.0</name>' "$pom"
            grep -Fq '<url>https://www.apache.org/licenses/LICENSE-2.0.txt</url>' "$pom"
            ! grep -Fq 'Durex CI placeholder - not for release' "$pom"
            ! grep -Fq 'example.invalid' "$pom"
          done

          gradle -p reference/publication-consumer clean classes \
            -PdurexRepository="$STAGING" \
            -PdurexVersion="$VERSION" \
            --refresh-dependencies \
            --stacktrace
      - name: Assemble signed Central Publisher Portal bundle
        id: bundle
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          STAGING: ${{ steps.staging.outputs.repository }}
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/build/durex-$VERSION-central-bundle.zip"
          scripts/central-release-bundle.sh "$STAGING" "$VERSION" signed "$bundle"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
          unzip -l "$bundle"
      - name: Upload, validate, and publish exact bundle to Maven Central
        id: central
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BUNDLE: ${{ steps.bundle.outputs.path }}
        run: |
          set -euo pipefail
          token=$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)
          short_sha=${GITHUB_SHA:0:12}
          upload_url="https://central.sonatype.com/api/v1/publisher/upload?name=durex-$VERSION-$short_sha&publishingType=USER_MANAGED"
          deployment_id=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $token" \
            --form "bundle=@$BUNDLE;type=application/octet-stream" \
            "$upload_url")
          [[ "$deployment_id" =~ ^[0-9a-fA-F-]{36}$ ]]
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

          status_url="https://central.sonatype.com/api/v1/publisher/status?id=$deployment_id"
          for _ in {1..60}; do
            status=$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $token" \
              "$status_url")
            state=$(jq -r '.deploymentState' <<<"$status")
            case "$state" in
              VALIDATED) break ;;
              FAILED) echo "$status" | jq .; exit 1 ;;
              *) sleep 10 ;;
            esac
          done
          test "$state" = VALIDATED

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $token" \
            "https://central.sonatype.com/api/v1/publisher/deployment/$deployment_id"

          for _ in {1..60}; do
            status=$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $token" \
              "$status_url")
            state=$(jq -r '.deploymentState' <<<"$status")
            case "$state" in
              PUBLISHED) break ;;
              FAILED) echo "$status" | jq .; exit 1 ;;
              *) sleep 10 ;;
            esac
          done
          test "$state" = PUBLISHED
      - name: Record tested release identity
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DEPLOYMENT_ID: ${{ steps.central.outputs.deployment_id }}
        run: |
          set -euo pipefail
          notes="$GITHUB_WORKSPACE/build/release-notes.md"
          mkdir -p "$(dirname "$notes")"
          cat > "$notes" <<EOF
          # Durex $VERSION

          Tested SHA: \`$GITHUB_SHA\`

          Maven artifacts:
          - \`io.github.qigao.durex:shared-common:$VERSION\`
          - \`io.github.qigao.durex:shared-spring-http:$VERSION\`
          - \`io.github.qigao.durex:messaging-api:$VERSION\`
          - \`io.github.qigao.durex:messaging-spring-redis:$VERSION\`

          License: Apache-2.0
          Central publication: true
          Central deployment: $DEPLOYMENT_ID
          EOF
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"
          echo "path=$notes" >> "$GITHUB_OUTPUT"
      - name: Create immutable GitHub release for published tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          test "$GITHUB_REF_NAME" = "$tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Durex $VERSION" --notes-file "$NOTES"
          else
            gh release create "$tag" --verify-tag --title "Durex $VERSION" --notes-file "$NOTES"
          fi
