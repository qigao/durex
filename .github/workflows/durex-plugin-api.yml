name: Durex Plugin API

on:
  push:
    paths:
      - 'build-bootstrap/**'
      - 'build-logic/**'
      - 'settings.gradle'
      - 'core/**/build.spring.gradle'
      - 'migration/**/settings.gradle'
      - 'reference/**/settings.gradle.kts'
      - 'reference/**/build.gradle.kts'
      - '.github/workflows/durex-plugin-api.yml'
  pull_request:
    paths:
      - 'build-bootstrap/**'
      - 'build-logic/**'
      - 'settings.gradle'
      - 'core/**/build.spring.gradle'
      - 'migration/**/settings.gradle'
      - 'reference/**/settings.gradle.kts'
      - 'reference/**/build.gradle.kts'
      - '.github/workflows/durex-plugin-api.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin-api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Verify local namespaces and published SimpleDSL consumers
        run: bash build-logic/tests/verify-plugin-namespaces.sh

      - name: Verify AOP feature capability
        run: gradle -p build-logic/tests/aop-feature-smoke verifyAopCapability dependencies --configuration runtimeClasspath --stacktrace

      - name: Verify transaction feature capability
        run: gradle -p build-logic/tests/transaction-feature-smoke verifyTransactionCapability dependencies --configuration compileClasspath --stacktrace

      - name: Verify web feature capability
        run: gradle -p build-logic/tests/web-feature-smoke verifyWebCapability dependencies --configuration runtimeClasspath --stacktrace

      - name: Verify HTTP client feature capability
        run: gradle -p build-logic/tests/http-client-feature-smoke verifyHttpClientCapability dependencies --configuration runtimeClasspath --stacktrace

      - name: Verify messaging feature capability
        run: gradle -p build-logic/tests/messaging-feature-smoke verifyMessagingCapability dependencies --configuration runtimeClasspath --stacktrace

      - name: Verify jOOQ schema public plugin
        shell: bash
        run: |
          gradle -p build-logic/tests/jooq-schema-smoke jooqCodegen --stacktrace
          test -f build-logic/tests/jooq-schema-smoke/build/generated-src/jooq/main/com/example/schema/tables/QMusic.java
          test -f build-logic/tests/jooq-schema-smoke/build/generated-src/jooq/main/com/example/schema/tables/records/RMusic.java

      - name: Verify JSON schema public plugin
        shell: bash
        run: |
          gradle -p build-logic/tests/json-schema-smoke compileJava --stacktrace
          test -f build-logic/tests/json-schema-smoke/build/generated-src/json/main/com/example/model/Music.java
          grep -Fq 'jakarta.validation' build-logic/tests/json-schema-smoke/build/generated-src/json/main/com/example/model/Music.java

      - name: Reject legacy jOOQ schema plugin id
        shell: bash
        run: |
          set -euo pipefail
          log=build-logic/tests/legacy-jooq-plugin-id-invalid.log
          if gradle -p build-logic/tests/legacy-jooq-plugin-id-invalid help --stacktrace >"$log" 2>&1; then
            echo 'expected legacy durex.jooq-schema plugin id to be rejected'
            exit 1
          fi
          grep -Fq 'durex.jooq-schema' "$log"
          grep -Fq 'was not found' "$log"
