name: Spring Messaging Platform

on:
  push:
    paths:
      - 'build-bootstrap/**'
      - 'build-logic/**'
      - 'gradle/dependencies/**'
      - 'core/shared/messaging/**'
      - 'core/redisson-service/**'
      - 'migration/spring-messaging/**'
      - '.github/workflows/spring-messaging.yml'
  pull_request:
    paths:
      - 'build-bootstrap/**'
      - 'build-logic/**'
      - 'gradle/dependencies/**'
      - 'core/shared/messaging/**'
      - 'core/redisson-service/**'
      - 'migration/spring-messaging/**'
      - '.github/workflows/spring-messaging.yml'

permissions:
  contents: read

jobs:
  redis-messaging:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Resolve Spring messaging project graph
        run: gradle -p migration/spring-messaging projects durexProjects --stacktrace

      - name: Validate messaging API and Redis adapter
        run: gradle -p migration/spring-messaging :messaging-api:test :messaging-spring-redis:test --configuration-cache --stacktrace

      - name: Verify legacy messaging implementation is gone
        shell: bash
        run: |
          set -euo pipefail
          test ! -e core/shared/messaging/messaging-api-redis
          test ! -e core/shared/messaging/messaging-api-redis-example
          test ! -e core/shared/messaging/build.gradle
          test ! -e core/redisson-service
          if grep -R -n -E 'javax\.enterprise|javax\.inject|javax\.interceptor|io\.quarkus|org\.redisson|org\.apache\.velocity|QuarkusDaemon|RemoteService|InComing' \
              core/shared/messaging/api core/shared/messaging/spring-redis; then
            echo 'legacy messaging source leaked into Spring messaging modules'
            exit 1
          fi

      - name: Verify Spring messaging runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          gradle -p migration/spring-messaging :messaging-spring-redis:dependencies --configuration compileClasspath --stacktrace | tee /tmp/messaging-classpath.log
          if grep -E 'javax\.enterprise|javax\.inject:|javax\.transaction|javax\.interceptor|io\.quarkus|org\.redisson|velocity-engine' /tmp/messaging-classpath.log; then
            echo 'legacy messaging runtime dependency leaked into Spring messaging compileClasspath'
            exit 1
          fi
