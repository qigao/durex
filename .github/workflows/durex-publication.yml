name: Durex Publication Surface

on:
  push:
    paths:
      - 'LICENSE'
      - 'core/shared/common/**'
      - 'core/shared/spring/http/**'
      - 'core/shared/messaging/api/**'
      - 'core/shared/messaging/spring-redis/**'
      - 'gradle/durex-publication.gradle'
      - 'gradle/public-api/**'
      - 'dependencies.toml'
      - 'dependencies/**'
      - 'scripts/public-api-signatures.sh'
      - 'reference/publication-consumer/**'
      - 'README.adoc'
      - 'docs/public-artifacts.md'
      - 'docs/public-api-lifecycle.md'
      - '.github/workflows/durex-publication.yml'
  pull_request:
    paths:
      - 'LICENSE'
      - 'core/shared/common/**'
      - 'core/shared/spring/http/**'
      - 'core/shared/messaging/api/**'
      - 'core/shared/messaging/spring-redis/**'
      - 'gradle/durex-publication.gradle'
      - 'gradle/public-api/**'
      - 'dependencies.toml'
      - 'dependencies/**'
      - 'scripts/public-api-signatures.sh'
      - 'reference/publication-consumer/**'
      - 'README.adoc'
      - 'docs/public-artifacts.md'
      - 'docs/public-api-lifecycle.md'
      - '.github/workflows/durex-publication.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  staged-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Publish explicit Durex surface to staging Maven repository
        shell: bash
        run: |
          set -euo pipefail
          staging="$GITHUB_WORKSPACE/build/durex-staging"
          ./gradlew \
            :shared-common:publishMavenJavaPublicationToStagingRepository \
            :shared-spring-http:publishMavenJavaPublicationToStagingRepository \
            :messaging-api:publishMavenJavaPublicationToStagingRepository \
            :messaging-spring-redis:publishMavenJavaPublicationToStagingRepository \
            -PdurexStagingRepo="$staging" \
            -PdurexVersion=0.1.0-SNAPSHOT \
            --stacktrace
      - name: Verify staged artifact, POM, and type boundary
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/build/durex-staging/io/github/qigao/durex"
          manifest="$GITHUB_WORKSPACE/gradle/public-api/0.1-surface.txt"

          find "$root" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort > /tmp/durex-artifacts.txt
          printf '%s\n' messaging-api messaging-spring-redis shared-common shared-spring-http | sort > /tmp/durex-expected-artifacts.txt
          diff -u /tmp/durex-expected-artifacts.txt /tmp/durex-artifacts.txt

          http_pom=$(find "$root/shared-spring-http/0.1.0-SNAPSHOT" -maxdepth 1 -type f -name '*.pom' -print -quit)
          messaging_pom=$(find "$root/messaging-spring-redis/0.1.0-SNAPSHOT" -maxdepth 1 -type f -name '*.pom' -print -quit)
          test -n "$http_pom"
          test -n "$messaging_pom"
          grep -Fq '<artifactId>shared-common</artifactId>' "$http_pom"
          grep -Fq '<artifactId>messaging-api</artifactId>' "$messaging_pom"

          main_jar() {
            local artifact="$1"
            find "$root/$artifact/0.1.0-SNAPSHOT" -maxdepth 1 -type f \
              -name "${artifact}-*.jar" \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              -print -quit
          }

          while IFS='|' read -r artifact scope fqcn; do
            case "$scope" in
              api|runtime) ;;
              *) echo "::error::Invalid public API scope '$scope' for $fqcn"; exit 1 ;;
            esac
            jar_file=$(main_jar "$artifact")
            test -n "$jar_file"
            class_entry="${fqcn//.//}.class"
            if ! jar tf "$jar_file" | grep -Fxq "$class_entry"; then
              echo "::error::Manifest type missing from $artifact: $fqcn"
              exit 1
            fi
          done < <(grep -vE '^[[:space:]]*(#|$)' "$manifest")

          common_jar=$(main_jar shared-common)
          for fqcn in \
            com.github.durex.shared.support.Helper \
            com.github.durex.shared.support.RespConstant \
            com.github.durex.shared.support.EnumValue; do
            class_entry="${fqcn//.//}.class"
            if jar tf "$common_jar" | grep -Fxq "$class_entry"; then
              echo "::error::Dead public support type still packaged: $fqcn"
              exit 1
            fi
          done
      - name: Verify Central bundle prerequisites
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/build/durex-staging/io/github/qigao/durex"
          for artifact in shared-common shared-spring-http messaging-api messaging-spring-redis; do
            version_dir="$root/$artifact/0.1.0-SNAPSHOT"
            main_jar=$(find "$version_dir" -maxdepth 1 -type f -name "${artifact}-*.jar" ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)
            sources_jar=$(find "$version_dir" -maxdepth 1 -type f -name '*-sources.jar' -print -quit)
            javadoc_jar=$(find "$version_dir" -maxdepth 1 -type f -name '*-javadoc.jar' -print -quit)
            pom=$(find "$version_dir" -maxdepth 1 -type f -name '*.pom' -print -quit)
            module=$(find "$version_dir" -maxdepth 1 -type f -name '*.module' -print -quit)

            test -n "$main_jar"
            test -n "$sources_jar"
            test -n "$javadoc_jar"
            test -n "$pom"
            test -n "$module"

            grep -Fq "<name>Durex $artifact</name>" "$pom"
            grep -Fq "<description>Durex public runtime/API module $artifact</description>" "$pom"
            grep -Fq '<url>https://github.com/qigao/durex</url>' "$pom"
            grep -Fq '<name>Apache License, Version 2.0</name>' "$pom"
            grep -Fq '<url>https://www.apache.org/licenses/LICENSE-2.0.txt</url>' "$pom"
            ! grep -Fq 'Durex CI placeholder - not for release' "$pom"
            ! grep -Fq 'example.invalid' "$pom"
            grep -Fq '<id>qigao</id>' "$pom"
            grep -Fq '<name>Qi Gao</name>' "$pom"
            grep -Fq '<url>https://github.com/qigao</url>' "$pom"
            grep -Fq '<connection>scm:git:https://github.com/qigao/durex.git</connection>' "$pom"
          done
      - name: Verify release metadata and signing gates
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :shared-common:generatePomFileForMavenJavaPublication \
            -PdurexVersion=0.1.0 \
            --stacktrace

          pom="$GITHUB_WORKSPACE/core/shared/common/build/publications/mavenJava/pom-default.xml"
          test -f "$pom"
          grep -Fq '<name>Apache License, Version 2.0</name>' "$pom"
          grep -Fq '<url>https://www.apache.org/licenses/LICENSE-2.0.txt</url>' "$pom"

          if ./gradlew :shared-common:generatePomFileForMavenJavaPublication \
            -PdurexVersion=0.1.0 \
            -PdurexLicenseName='Legacy override must fail' \
            -PdurexLicenseUrl='https://example.invalid/legacy-license' \
            --stacktrace; then
            echo '::error::Legacy license override was accepted; Apache-2.0 must be repository-owned metadata'
            exit 1
          fi

          ./gradlew :shared-common:tasks --all | grep -Fq 'signMavenJavaPublication'
      - name: Verify public API signature compatibility
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/build/durex-staging/io/github/qigao/durex"
          manifest="$GITHUB_WORKSPACE/gradle/public-api/0.1-surface.txt"
          baseline="$GITHUB_WORKSPACE/gradle/public-api/0.1-signatures.txt"
          current=/tmp/durex-current-signatures.txt
          scripts/public-api-signatures.sh generate "$root" "$manifest" "$current"
          echo '--- current normalized public API signatures ---'
          cat "$current"
          echo '--- compatibility check ---'
          scripts/public-api-signatures.sh check "$root" "$manifest" "$baseline"

          cp "$baseline" /tmp/durex-broken-baseline.txt
          echo 'com.github.durex.shared.model.RespData|  public void __compatibility_self_test__();' >> /tmp/durex-broken-baseline.txt
          if scripts/public-api-signatures.sh check "$root" "$manifest" /tmp/durex-broken-baseline.txt; then
            echo '::error::Compatibility checker accepted an intentionally missing signature'
            exit 1
          fi
          echo 'Compatibility checker self-test rejected the injected missing signature as expected.'
      - name: Verify public API documentation contract
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/public-api-lifecycle.md
          grep -Fq 'xref:docs/public-artifacts.md[Public artifacts and Maven-only examples]' README.adoc
          grep -Fq 'xref:docs/public-api-lifecycle.md[Public API lifecycle and deprecation policy]' README.adoc
          grep -Fq 'io.github.qigao.durex:shared-spring-http:0.1.0' docs/public-artifacts.md
          grep -Fq 'io.github.qigao.durex:messaging-spring-redis:0.1.0' docs/public-artifacts.md
          grep -Fq '`api` means the type is a supported user-facing contract.' docs/public-api-lifecycle.md
          grep -Fq 'Keep the deprecated signature for the remainder of the `0.1.x` line.' docs/public-api-lifecycle.md
      - name: Compile external Maven-only consumer baseline
        shell: bash
        run: |
          set -euo pipefail
          gradle -p reference/publication-consumer clean classes \
            -PdurexRepository="$GITHUB_WORKSPACE/build/durex-staging" \
            -PdurexVersion=0.1.0-SNAPSHOT \
            --refresh-dependencies \
            --stacktrace
