name: Durex Publication Surface

on:
  push:
    paths:
      - 'core/shared/common/**'
      - 'core/shared/spring/http/**'
      - 'core/shared/messaging/api/**'
      - 'core/shared/messaging/spring-redis/**'
      - 'gradle/durex-publication.gradle'
      - 'gradle/public-api/**'
      - 'gradle/dependencies/**'
      - 'scripts/public-api-signatures.sh'
      - 'reference/publication-consumer/**'
      - 'docs/public-artifacts.md'
      - '.github/workflows/durex-publication.yml'
  pull_request:
    paths:
      - 'core/shared/common/**'
      - 'core/shared/spring/http/**'
      - 'core/shared/messaging/api/**'
      - 'core/shared/messaging/spring-redis/**'
      - 'gradle/durex-publication.gradle'
      - 'gradle/public-api/**'
      - 'gradle/dependencies/**'
      - 'scripts/public-api-signatures.sh'
      - 'reference/publication-consumer/**'
      - 'docs/public-artifacts.md'
      - '.github/workflows/durex-publication.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  staged-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Publish explicit Durex surface to staging Maven repository
        shell: bash
        run: |
          set -euo pipefail
          staging="$GITHUB_WORKSPACE/build/durex-staging"
          ./gradlew \
            :shared-common:publishMavenJavaPublicationToStagingRepository \
            :shared-spring-http:publishMavenJavaPublicationToStagingRepository \
            :messaging-api:publishMavenJavaPublicationToStagingRepository \
            :messaging-spring-redis:publishMavenJavaPublicationToStagingRepository \
            -PdurexStagingRepo="$staging" \
            -PdurexVersion=0.1.0-SNAPSHOT \
            --stacktrace
      - name: Verify staged artifact, POM, and type boundary
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/build/durex-staging/io/github/qigao/durex"
          manifest="$GITHUB_WORKSPACE/gradle/public-api/0.1-surface.txt"

          find "$root" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort > /tmp/durex-artifacts.txt
          printf '%s\n' messaging-api messaging-spring-redis shared-common shared-spring-http | sort > /tmp/durex-expected-artifacts.txt
          diff -u /tmp/durex-expected-artifacts.txt /tmp/durex-artifacts.txt

          http_pom=$(find "$root/shared-spring-http/0.1.0-SNAPSHOT" -maxdepth 1 -type f -name '*.pom' -print -quit)
          messaging_pom=$(find "$root/messaging-spring-redis/0.1.0-SNAPSHOT" -maxdepth 1 -type f -name '*.pom' -print -quit)
          test -n "$http_pom"
          test -n "$messaging_pom"
          grep -Fq '<artifactId>shared-common</artifactId>' "$http_pom"
          grep -Fq '<artifactId>messaging-api</artifactId>' "$messaging_pom"

          main_jar() {
            local artifact="$1"
            find "$root/$artifact/0.1.0-SNAPSHOT" -maxdepth 1 -type f \
              -name "${artifact}-*.jar" \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              -print -quit
          }

          while IFS='|' read -r artifact scope fqcn; do
            case "$scope" in
              api|runtime) ;;
              *) echo "::error::Invalid public API scope '$scope' for $fqcn"; exit 1 ;;
            esac
            jar_file=$(main_jar "$artifact")
            test -n "$jar_file"
            class_entry="${fqcn//.//}.class"
            if ! jar tf "$jar_file" | grep -Fxq "$class_entry"; then
              echo "::error::Manifest type missing from $artifact: $fqcn"
              exit 1
            fi
          done < <(grep -vE '^[[:space:]]*(#|$)' "$manifest")

          common_jar=$(main_jar shared-common)
          for fqcn in \
            com.github.durex.shared.support.Helper \
            com.github.durex.shared.support.RespConstant \
            com.github.durex.shared.support.EnumValue; do
            class_entry="${fqcn//.//}.class"
            if jar tf "$common_jar" | grep -Fxq "$class_entry"; then
              echo "::error::Dead public support type still packaged: $fqcn"
              exit 1
            fi
          done
      - name: Verify public API signature compatibility
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/build/durex-staging/io/github/qigao/durex"
          manifest="$GITHUB_WORKSPACE/gradle/public-api/0.1-surface.txt"
          baseline="$GITHUB_WORKSPACE/gradle/public-api/0.1-signatures.txt"
          current=/tmp/durex-current-signatures.txt
          scripts/public-api-signatures.sh generate "$root" "$manifest" "$current"
          echo '--- current normalized public API signatures ---'
          cat "$current"
          echo '--- compatibility check ---'
          scripts/public-api-signatures.sh check "$root" "$manifest" "$baseline"

          cp "$baseline" /tmp/durex-broken-baseline.txt
          echo 'com.github.durex.shared.model.RespData|  public void __compatibility_self_test__();' >> /tmp/durex-broken-baseline.txt
          if scripts/public-api-signatures.sh check "$root" "$manifest" /tmp/durex-broken-baseline.txt; then
            echo '::error::Compatibility checker accepted an intentionally missing signature'
            exit 1
          fi
          echo 'Compatibility checker self-test rejected the injected missing signature as expected.'
      - name: Compile external Maven-only consumer baseline
        shell: bash
        run: |
          set -euo pipefail
          gradle -p reference/publication-consumer clean classes \
            -PdurexRepository="$GITHUB_WORKSPACE/build/durex-staging" \
            -PdurexVersion=0.1.0-SNAPSHOT \
            --refresh-dependencies \
            --stacktrace
