import com.github.durex.gradle.DurexDependencyAccess
import com.github.durex.gradle.ModuleKind
import com.github.durex.gradle.model.DurexModuleModel

plugins {
    id 'org.springframework.boot'
    id 'durex.internal.spring-base'
}

def model = extensions.getByType(DurexModuleModel)
model.claim(ModuleKind.SPRING_SERVICE, project.path)
['spring-core', 'spring-web', 'spring-validation', 'spring-observability'].each { alias ->
    DurexDependencyAccess.add(project, model, 'implementation', alias)
}
['spring-test', 'spring-web-test'].each { alias ->
    DurexDependencyAccess.add(project, model, 'testImplementation', alias)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
