import com.github.durex.gradle.DurexDependencyAccess
import org.gradle.api.GradleException
import org.jooq.meta.jaxb.MatcherTransformType

plugins {
    id 'org.jooq.jooq-codegen-gradle'
}

class DurexJooqSchemaExtension {
    String source = 'database/schema/**/*.sql'
    String packageName
    String sort = 'semantic'
    String tablePrefix = 'Q'
    String recordPrefix = 'R'
}

def schema = extensions.create('durexJooq', DurexJooqSchemaExtension)
def registry = DurexDependencyAccess.service(project)

dependencies {
    jooqCodegen registry.library('jooq-meta-extensions').notation()
    implementation registry.library('jooq-core').notation()
}

plugins.withId('java') {
    tasks.named('compileJava') {
        dependsOn tasks.named('jooqCodegen')
    }
}

afterEvaluate {
    if (!schema.packageName) {
        throw new GradleException('durexJooq.packageName must be configured')
    }

    jooq {
        configuration {
            generator {
                database {
                    name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
                    properties {
                        property {
                            key = 'scripts'
                            value = schema.source
                        }
                        property {
                            key = 'sort'
                            value = schema.sort
                        }
                        property {
                            key = 'unqualifiedSchema'
                            value = 'none'
                        }
                        property {
                            key = 'defaultNameCase'
                            value = 'as_is'
                        }
                    }
                }
                strategy {
                    matchers {
                        tables {
                            table {
                                tableClass {
                                    transform = MatcherTransformType.PASCAL
                                    expression = "${schema.tablePrefix}_\$0"
                                }
                                recordClass {
                                    transform = MatcherTransformType.PASCAL
                                    expression = "${schema.recordPrefix}_\$0"
                                }
                            }
                        }
                    }
                }
                generate {
                    records = true
                    fluentSetters = true
                }
                target {
                    packageName = schema.packageName
                    directory = layout.buildDirectory.dir('generated-src/jooq/main').get().asFile.absolutePath
                }
            }
        }
    }
}
