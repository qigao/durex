plugins { id 'durex.internal.catalog' }

import com.github.durex.gradle.catalog.DependencyCatalogSnapshot

def catalog = extensions.getByType(DependencyCatalogSnapshot)
assert catalog.javaVersion() == 25
assert catalog.platform('spring').coordinate() ==
    'org.springframework.boot:spring-boot-dependencies:4.1.0'
assert catalog.library('spring-jooq').platform == 'spring'
assert catalog.plugin('graalvm-native').id == 'org.graalvm.buildtools.native'

def registration = gradle.sharedServices.registrations.findByName('durexDependencyRegistry')
def service = registration.service.get()
def snapshot = service.getClass().getMethod('snapshot').invoke(service)

def assertNeutral
assertNeutral = { value ->
    assert value != null
    if (value instanceof Map) {
        value.each { key, nested ->
            assert key instanceof String
            assertNeutral(nested)
        }
    } else if (value instanceof List) {
        value.each { nested -> assertNeutral(nested) }
    } else {
        assert value instanceof String || value instanceof Integer || value instanceof Boolean
    }
}
assertNeutral(snapshot)

try {
    snapshot.clear()
    assert false: 'snapshot root must be immutable'
} catch (UnsupportedOperationException ignored) {}
try {
    snapshot.platforms.spring.clear()
    assert false: 'snapshot nested maps must be immutable'
} catch (UnsupportedOperationException ignored) {}
